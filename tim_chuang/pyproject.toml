[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
tfx_trading = ["trade_days/*.json"]


[project]
name = "tim-chuang"
version = "0.1.0"
description = "Taiwan futures trading application"
requires-python = ">=3.14"

dependencies = [
    "pyyaml",
    "shioaji==1.5.6",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]


[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "double"


[tool.pytest.ini_options]
testpaths = [
    "tests",
]


[tool.mypy]
python_version = "3.14"
files = ["."]
strict = true

[[tool.mypy.overrides]]
module = "shioaji.*"
ignore_missing_imports = true