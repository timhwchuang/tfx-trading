# =============================================================================
# Simple strategy — infrastructure / UAT soak (non-secret)
# Target: Windows (see README.md)
# =============================================================================
#
# Secrets via environment (PowerShell):
#   $env:SJ_API_KEY = "your_api_key"
#   $env:SJ_SEC_KEY = "your_secret_key"
#   $env:SJ_CA_PATH = "C:\certs\Sinopac.pfx"
#   $env:SJ_CA_PASSWD = "your_ca_password"
#
# Optional overrides:
#   $env:CONFIG_PATH = "C:\tfx-trading\apps\trading-app\config\config.yaml"
#   $env:LOG_LEVEL = "DEBUG"
#   $env:LOG_FILE = "C:\logs\trading-app-uat.log"

# Shioaji simulation (set false only for real CA pilot)
simulation: true

# Product (Shioaji near-month continuous: TXFR1 / MXFR1 / TMFR1)
product_code: TMFR1

strategy:
  name: simple
  # UAT flip: seconds after last confirmed fill before next buy/sell
  flip_interval_sec: 300
  # Post-exit Host cooldown (seconds)
  cooldown_sec: 10
  # Capital risk: progressive realized MDD (cross-day). <=0 disables (UAT).
  # Not day-scoped; clear_capital_risk() is the only operator reset.
  max_mdd_points: 0
  # Durable capital book (JSON, atomic write). Empty disables (unit tests).
  capital_state_path: "var/capital_risk.json"
  # Deprecated gates (ignored by Host capital freeze):
  max_daily_loss_points: 120
  max_consecutive_loss: 4
  # IOC / pending
  pending_timeout_sec: 1
  ioc_slippage_points: 3
  no_tick_timeout_sec: 45
  clock_skew_warn_sec: 1.0

session:
  # Day session (TAIFEX)
  start: "08:45"
  end: "13:45"
  flatten_time: "13:40"
  force_flatten_time: "13:44"
  flatten_slippage_points: 8
  # Night session (enabled for all-day UAT soak)
  night_enabled: true
  night_start: "15:00"
  night_end: "05:00"
  night_flatten_time: "04:50"
  night_force_flatten_time: "04:55"

logging:
  level: INFO
  file: ""

operations:
  exit_order_max_retries: 3
  exit_order_retry_delay_sec: 1.0
  session_watchdog_sec: 30.0
  session_relogin_max_attempts: 5
  session_relogin_backoff_base_sec: 5.0
  reconnect_warmup_sec: 300
  max_disconnects_per_day: 3
  alert_on_disconnect_with_position: true
  no_tick_resubscribe_escalate_after: 3
  position_reconcile_sec: 60
  max_position_qty: 1
  settle_timeout_sec: 45
  reconcile_fast_sec: 1
  reconcile_confirm_reads: 3
  emergency_market_orders: true
  entry_miss_confirm_sec: 5
  exit_miss_confirm_sec: 5
  post_exit_reconcile_sec: 15
  cleared_order_registry_sec: 120
  max_consecutive_missed_entries: 3
